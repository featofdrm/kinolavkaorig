<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoLavka - Регистрация</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
        }
        input.invalid {
            border: 1px solid red;
        }
        .success-message {
            display: none;
            background-color: #dff0d8;
            color: #3c763d;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>KinoLavka</h1>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="films.html">Фильмы</a></li>
                <li><a href="series.html">Сериалы</a></li>
                <li><a href="gallery.html">Фотогалерея</a></li>
                <li><a href="registration.html">Регистрация</a></li>
                <li><a href="lists-tables.html">Списки и таблицы</a></li>
            </ul>
        </nav>
        <div class="search">
            <input type="text" placeholder="Поиск фильмов и сериалов...">
            <button>Найти</button>
        </div>
    </header>

    <main>
        <h2>Регистрация</h2>
        <div id="successMessage" class="success-message">
            Регистрация прошла успешно! Спасибо за регистрацию.
        </div>
        <form id="registrationForm" action="#" method="post">
            <!-- имя -->
            <label for="firstname">Имя:</label>
            <input type="text" id="firstname" name="firstname" required>
            <div id="firstnameError" class="error"></div>

            <!-- фамилия -->
            <label for="lastname">Фамилия:</label>
            <input type="text" id="lastname" name="lastname" required>
            <div id="lastnameError" class="error"></div>

            <!-- электронная почта -->
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error"></div>

            <!-- пароль -->
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required>
            <div id="passwordError" class="error"></div>

            <!-- подтверждение пароля -->
            <label for="confirm-password">Подтвердите пароль:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <div id="confirmPasswordError" class="error"></div>

            <!-- дата рождения -->
            <label for="birthdate">Дата рождения:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            <div id="birthdateError" class="error"></div>

            <!-- пол -->
            <div class="radio-group">
                <label>Пол:</label>
                <label for="male"><input type="radio" id="male" name="gender" value="male" required> Мужской</label>
                <label for="female"><input type="radio" id="female" name="gender" value="female" required> Женский</label>
                <div id="genderError" class="error"></div>
            </div>

            <!-- страна проживания -->
            <label for="country">Страна проживания:</label>
            <select id="country" name="country" required>
                <option value="">Выберите страну:</option>
                <option value="ru">Россия</option>
                <option value="us">США</option>
                <option value="de">Германия</option>
                <option value="fr">Франция</option>
                <option value="jp">Япония</option>
                <option value="kz">Казахстан</option>
            </select>
            <div id="countryError" class="error"></div>

            <!-- согласие на обработку данных -->
            <div class="checkbox-group">
                <label for="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    Я согласен на обработку персональных данных
                </label>
                <div id="termsError" class="error"></div>
            </div>

            <!-- кнопка отправки -->
            <input type="submit" value="Зарегистрироваться">
        </form>
    </main>

    <footer>
        <p>&copy; 2025 KinoLavka. Все права защищены.</p>
        <address>
            Свяжитесь с нами: <a href="mailto:info@kinolavka.com">info@kinolavka.com</a>
        </address>
    </footer>

<script>

document.addEventListener('DOMContentLoaded', function() {
    // Общие обработчики для всех страниц
    
    // Анимация при наведении на навигационные ссылки
    const navLinks = document.querySelectorAll('nav ul li a');
    navLinks.forEach(link => {
        link.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.1)';
        });
        link.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    });

    // Обработка поиска
    const searchForm = document.querySelector('.search');
    if (searchForm) {
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const query = this.querySelector('input').value.trim();
            if (query) {
                alert(`Вы искали: ${query}\nПоиск будет реализован в будущем!`);
                this.querySelector('input').value = '';
            }
        });
    }

    // Подсветка активной страницы в навигации
    const currentPage = location.pathname.split('/').pop();
    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPage) {
            link.classList.add('active');
            link.style.fontWeight = 'bold';
        }
    });

    // Анимация карточек фильмов/сериалов
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        card.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-10px)';
            this.style.boxShadow = '0 10px 20px rgba(0,0,0,0.2)';
        });
        card.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
            this.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
        });
    });

    // Обработка кликов по карточкам
    cards.forEach(card => {
        card.addEventListener('click', function(e) {
            if (!e.target.classList.contains('btn')) {
                const link = this.querySelector('a.btn');
                if (link) window.location.href = link.href;
            }
        });
    });
});

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registrationForm');
        const successMessage = document.getElementById('successMessage');
        
        // валидация при вводе
        form.addEventListener('input', function(e) {
            validateField(e.target);
        });
        
        // валидация при отправке формы
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            const fields = form.querySelectorAll('input, select');
            
            fields.forEach(field => {
                if (!validateField(field)) {
                    isValid = false;
                }
            });
            
            if (isValid) {
                // имитация отправки данных
                setTimeout(() => {
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                    
                    // можно добавить здесь реальную отправку формы
                    // form.submit();
                }, 1000);
            }
        });
        
        function validateField(field) {
            let isValid = true;
            const errorElement = document.getElementById(`${field.id}Error`);
            
            if (!errorElement) return true;
            
            errorElement.textContent = '';
            field.classList.remove('invalid');
            
            // проверка обязательных полей
            if (field.required && !field.value.trim()) {
                errorElement.textContent = 'Это поле обязательно для заполнения';
                field.classList.add('invalid');
                return false;
            }
            
            // специальные проверки для разных типов полей
            switch(field.id) {
                case 'email':
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(field.value)) {
                        errorElement.textContent = 'Введите корректный email';
                        field.classList.add('invalid');
                        isValid = false;
                    }
                    break;
                    
                case 'password':
                    if (field.value.length < 8) {
                        errorElement.textContent = 'Пароль должен содержать минимум 8 символов';
                        field.classList.add('invalid');
                        isValid = false;
                    }
                    break;
                    
                case 'confirm-password':
                    const password = document.getElementById('password').value;
                    if (field.value !== password) {
                        errorElement.textContent = 'Пароли не совпадают';
                        field.classList.add('invalid');
                        isValid = false;
                    }
                    break;
                    
                case 'birthdate':
                    const birthDate = new Date(field.value);
                    const today = new Date();
                    let age = today.getFullYear() - birthDate.getFullYear();
                    const monthDiff = today.getMonth() - birthDate.getMonth();
                    
                    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                        age--;
                    }
                    
                    if (age < 18) {
                        errorElement.textContent = 'Вам должно быть не менее 18 лет';
                        field.classList.add('invalid');
                        isValid = false;
                    }
                    break;
            }
            
            return isValid;
        }
        
        // динамическое изменение страны
        const countrySelect = document.getElementById('country');
        countrySelect.addEventListener('change', function() {
            console.log(`Выбрана страна: ${this.options[this.selectedIndex].text}`);
        });
    });
</script>
</body>
</html>
