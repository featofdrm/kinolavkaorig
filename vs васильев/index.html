<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoLavka - Главная</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="index-page"> <!-- Добавлен класс index-page -->
    <header>
        <h1>KinoLavka</h1>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="films.html">Фильмы</a></li>
                <li><a href="series.html">Сериалы</a></li>
                <li><a href="gallery.html">Фотогалерея</a></li>
                <li><a href="registration.html">Регистрация</a></li>
                <li><a href="lists-tables.html">Списки и таблицы</a></li>
            </ul>
        </nav>
        <div class="search">
            <input type="text" placeholder="Поиск фильмов и сериалов...">
            <button>Найти</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Добро пожаловать на KinoLavka!</h2>
                <p>Здесь вы найдете подборки лучших фильмов и сериалов, рейтинги и обзоры.</p>
                <a href="about.html" class="btn">Узнать больше</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 KinoLavka. Все права защищены.</p>
        <address>
            Свяжитесь с нами: <a href="mailto:info@kinolavka.com">info@kinolavka.com</a>
        </address>
    </footer>

<script>
// Анимация 
const hero = document.querySelector('.hero');
if (hero) {
    hero.style.opacity = '0';
    setTimeout(() => {
        hero.style.transition = 'opacity 1s ease';
        hero.style.opacity = '1';
    }, 300);
}

// Обработка кнопки "Узнать больше"
const aboutBtn = document.querySelector('.hero .btn');
if (aboutBtn) {
    aboutBtn.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelector('main').scrollIntoView({ behavior: 'smooth' });
    });
}

        document.addEventListener('DOMContentLoaded', function() {
            // Общие обработчики для всех страниц
            
            // Анимация при наведении на навигационные ссылки
            const navLinks = document.querySelectorAll('nav ul li a');
            navLinks.forEach(link => {
                link.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.1)';
                });
                link.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        
            // Обработка поиска
            const searchForm = document.querySelector('.search');
            if (searchForm) {
                searchForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const query = this.querySelector('input').value.trim();
                    if (query) {
                        alert(`Вы искали: ${query}\nПоиск будет реализован в будущем!`);
                        this.querySelector('input').value = '';
                    }
                });
            }
        
            // Подсветка активной страницы в навигации
            const currentPage = location.pathname.split('/').pop();
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                    link.style.fontWeight = 'bold';
                }
            });
        
            // Анимация карточек фильмов/сериалов
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-10px)';
                    this.style.boxShadow = '0 10px 20px rgba(0,0,0,0.2)';
                });
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                    this.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
                });
            });
        
            // Обработка кликов по карточкам
            cards.forEach(card => {
                card.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('btn')) {
                        const link = this.querySelector('a.btn');
                        if (link) window.location.href = link.href;
                    }
                });
            });
        });
</script>
</body>
</html>
